name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changelog
        run: pnpm changelog:check

      - name: Type check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Setup Python for skill conformance
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned skill reference validator
        run: python -m pip install -r scripts/skills-ref-requirements.txt

      - name: Check generated skill conformance
        run: pnpm run test:skill-conformance

      - name: Check skill procedure workflows
        run: node scripts/evaluate-skill-workflows.mjs
